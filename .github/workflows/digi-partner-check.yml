name: Digi Partner checks

on:
  push:
    branches:
      - feature/digi-partner-0.0.29-push-client
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check app and Worker syntax
        run: node server/scripts/check-syntax.mjs
